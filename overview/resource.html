<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#007AFF;--bg:#F5F7FB;--card:#FFF;--text:#1C1C1E;--secondary:#8E8E93;--line:#E9ECF2;--shadow:0 5px 20px rgba(40,70,110,.045)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;transition:background .3s,color .3s}
body.night{--bg:#0B0D12;--card:#171A21;--text:#F5F5F7;--secondary:#9899A2;--line:#292D36;--shadow:none}
.header{position:sticky;top:0;z-index:100;padding:18px 20px 15px;background:rgba(255,255,255,.88);border-bottom:1px solid rgba(220,224,232,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.night .header{background:rgba(11,13,18,.88);border-color:#292D36}
.header-inner{max-width:760px;margin:0 auto}
.info-bar{font-size:12px;font-weight:600;color:var(--secondary);letter-spacing:.4px;margin-bottom:3px}
#greeting-box{font-size:29px;font-weight:750;letter-spacing:-1px;margin-bottom:16px}
.nav-tabs{display:flex;gap:8px}
.nav-btn{flex:1;display:flex;justify-content:center;align-items:center;height:42px;border-radius:13px;text-decoration:none;font-size:14px;font-weight:600;background:#F0F2F6;color:#737985;transition:.2s}
.nav-btn.btn-active{background:var(--blue);color:#FFF;box-shadow:0 5px 13px rgba(0,122,255,.18)}
.night .nav-btn{background:#242832;color:#A8ACB7}
.night .nav-btn.btn-active{background:#0A84FF;color:#FFF}
.container{width:100%;max-width:760px;margin:0 auto;padding:20px 18px 30px}
.search-container{position:relative;margin-bottom:27px}
.search-box{width:100%;height:48px;border:1px solid transparent;border-radius:15px;padding:0 16px 0 43px;font-size:15px;color:var(--text);background:#E9EDF4;outline:none;transition:.2s;-webkit-appearance:none}
.search-box:focus{border-color:rgba(0,122,255,.5);background:var(--card);box-shadow:0 0 0 3px rgba(0,122,255,.08)}
.search-box::placeholder{color:#8E929D}
.search-container:before{content:"⌕";position:absolute;z-index:1;left:16px;top:7px;font-size:26px;line-height:32px;color:#8E929D;pointer-events:none}
.night .search-box{background:#1C2028;color:#FFF}
.night .search-box::placeholder{color:#777C87}
.category-group{margin-bottom:27px}
.category-title{display:flex;align-items:center;font-size:17px;font-weight:750;letter-spacing:-.3px;color:var(--text);margin:0 4px 12px}
.category-title:before{content:"";width:4px;height:17px;border-radius:5px;background:var(--blue);margin-right:9px}
.category-title:after{content:"";flex:1;height:1px;background:var(--line);margin-left:13px}
.category-group:first-child .category-title{color:var(--blue)}
.resource-list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;width:100%;min-height:83px;padding:13px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;overflow:hidden;transition:transform .15s,opacity .15s}
.card:active{transform:scale(.985);opacity:.8}
.img-box{flex-shrink:0;width:56px;height:56px;border-radius:14px;overflow:hidden;background:#EDF0F5;margin-right:13px;display:flex;align-items:center;justify-content:center}
.img-box img{display:block;width:100%;height:100%;object-fit:cover}
.night .img-box{background:#252A34}
.res-info{flex:1;min-width:0;overflow:hidden}
.resource-title{display:block;font-size:15px;line-height:22px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.resource-tag{display:block;color:var(--secondary);font-size:12px;line-height:18px}
.card:after{content:"›";flex-shrink:0;color:#B8BEC9;font-size:24px;font-weight:300;margin-left:10px}
.empty-state{text-align:center;padding:35px 15px;color:var(--secondary);font-size:14px}
.empty-state-icon{font-size:32px;margin-bottom:8px}
.footer{text-align:center;padding:15px 0 25px;font-size:12px;line-height:24px;color:var(--secondary)}
@media(max-width:380px){.header{padding:15px 15px 13px}.container{padding:17px 13px 25px}#greeting-box{font-size:26px}.card{min-height:76px;padding:11px;border-radius:16px}.img-box{width:50px;height:50px;border-radius:12px;margin-right:11px}.resource-title{font-size:14px}}
</style>
</head>

function getQueryParam(name){
var reg=new RegExp("(^|&)"+name+"=([^&]*)(&|$)","i");
var r=window.location.search.substr(1).match(reg);
if(r!=null)return decodeURIComponent(r[2]);
return null;
}

function initThemeAndGreeting(){
var now=new Date();
var hours=now.getHours();
var days=["周日","周一","周二","周三","周四","周五","周六"];
var months=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
document.getElementById("date-box").innerHTML=months[now.getMonth()]+" "+now.getDate()+"日 · "+days[now.getDay()];
var greeting=hours>=5&&hours<11?"早上好":hours>=11&&hours<17?"下午好":"晚上好";
document.getElementById("greeting-box").innerHTML=greeting;
document.body.className=hours>=17||hours<5?"night":"light";
}

function escapeHTML(str){
return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

section+='<div class="img-box"><img src="'+escapeHTML(img)+'" alt="" loading="lazy" onerror="this.onerror=null;this.src=\''+DEFAULT_IMG+'\'"></div>';
section+='<div class="res-info">';
section+='<span class="resource-title">'+escapeHTML(item.title)+'</span>';
section+='<span class="resource-tag">点击获取资源</span>';
section+='</div></a>';
}
section+='</div></div>';
return section;
}

function render(){
var page=getQueryParam("page")||"2";
var container=document.getElementById("contentContainer");
var html="";
document.getElementById("tab-pc").className="nav-btn"+(page==="1"?" btn-active":"");
document.getElementById("tab-web").className="nav-btn"+(page==="2"?" btn-active":"");

// PC分区包含的分类（含“希沃软件”）
var pcCategories=["Office软件","Adoble软件","希沃软件"];
var displayData={};
var allWebItems=[];

for(var cat in rawData){
var isPC=pcCategories.indexOf(cat)>-1;
if(page==="1"&&isPC){
displayData[cat]=rawData[cat];
}else if(page==="2"&&!isPC){
// 关键修改：WEB分区排除“希沃软件”分类（即使它不在pcCategories里也要排除）
if(cat==="希沃软件") continue;
displayData[cat]=rawData[cat];
allWebItems=allWebItems.concat(rawData[cat]);
}
}

if(page==="2"&&allWebItems.length>0){
var recommended=allWebItems.slice().sort(function(){return .5-Math.random()}).slice(0,10);
html+=buildSection("智能推荐 ✨",recommended);
}

for(var catName in displayData){
html+=buildSection(catName,displayData[catName]);
}

container.innerHTML=html;
}

function handleSearch(){
var keyword=document.getElementById("searchInput").value.toLowerCase().replace(/^\s+|\s+$/g,"");
var cards=document.getElementsByClassName("card");
var visibleCount=0;

for(var i=0;i<cards.length;i++){
var title=cards[i].getElementsByClassName("resource-title")[0].innerHTML.toLowerCase();
if(title.indexOf(keyword)>-1){
cards[i].style.display="flex";
visibleCount++;
}else{
cards[i].style.display="none";
}
}

var empty=document.getElementById("search-empty");

if(keyword&&visibleCount===0){
if(!empty){
empty=document.createElement("div");
empty.id="search-empty";
empty.className="empty-state";
empty.innerHTML='<div class="empty-state-icon">⌕</div><div>没有找到相关资源</div><div style="font-size:12px;margin-top:5px">试试其他关键词吧</div>';
document.getElementById("contentContainer").appendChild(empty);
}
}else if(empty){
empty.parentNode.removeChild(empty);
}
}

document.getElementById("searchInput").addEventListener("input",handleSearch);
initThemeAndGreeting();
render();
</script>
</body>
</html>
