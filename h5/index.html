<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>趣加应用</title>
    
    <script>
        (function() {
            var ua = navigator.userAgent;
            var needRedirect = false;

            var iosMatch = ua.match(/(iPhone|iPod|iPad).*OS\s+(\d+)_/i);
            if (iosMatch && parseInt(iosMatch[2], 10) < 11) {
                needRedirect = true;
            }

            var chromeMatch = ua.match(/Chrome\/(\d+)/i);
            if (chromeMatch && parseInt(chromeMatch[1], 10) < 60) {
                needRedirect = true;
            }

            var firefoxMatch = ua.match(/Firefox\/(\d+)/i);
            if (firefoxMatch && parseInt(firefoxMatch[1], 10) < 60) {
                needRedirect = true;
            }

            if (needRedirect) {
                window.location.replace('https://qujia.qujiaweb.top');
            }
        })();
    </script>

    <style>
        :root {
            --bg-color: #F2F2F7;
            --text-color: #1c1c1e;
            --danger-color: #ff3b30;
            --accent-color: #007aff;
            --overlay-bg: rgba(0, 0, 0, 0.4);
            --card-bg: #ffffff;
            --card-radius: 24px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            --btn-primary: #007aff;
            --btn-outline: #007aff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-color: #ffffff;
                --danger-color: #ff453a;
                --accent-color: #0a84ff;
                --overlay-bg: rgba(0, 0, 0, 0.6);
                --card-bg: #1c1c1e;
                --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
                --btn-primary: #0a84ff;
                --btn-outline: #0a84ff;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            transition: background-color 0.3s ease;
            position: relative;
        }

        /* ---------- 对话框 (更新弹窗) ---------- */
        .update-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .update-card {
            background: var(--card-bg);
            max-width: 340px;
            width: 100%;
            border-radius: var(--card-radius);
            padding: 32px 24px 24px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: background 0.3s;
            animation: scaleIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        }

        .update-card .icon-badge {
            font-size: 44px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .update-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .update-card .version-tag {
            display: inline-block;
            background: var(--accent-color);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 40px;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .update-card .desc {
            font-size: 15px;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .update-card .actions {
            display: flex;
            flex-direction: row;
            gap: 12px;
            justify-content: center;
        }

        .update-card .btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--btn-primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }

        .update-card .btn-outline {
            background: transparent;
            color: var(--btn-outline);
            box-shadow: none;
            border: 1.5px solid var(--btn-outline);
            background: transparent;
        }

        .update-card .btn-outline:active {
            background: var(--btn-outline);
            color: #fff;
            opacity: 0.7;
        }

        .update-card .btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        /* ---------- 欢迎回来 (原有) ---------- */
        .welcome-wrapper {
            position: relative;
            display: none;
            width: 100%;
            height: 120px;
            align-items: center;
            justify-content: center;
            transform: translateY(-40px);
            z-index: 1;
        }

        .loading-text {
            position: relative;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 10px;
            color: var(--text-color);
            text-indent: 10px;
        }

        .text-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        /* ---------- 动画 ---------- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 更新对话框 (默认显示) -->
    <div class="update-overlay" id="updateDialog">
        <div class="update-card">
            <div class="icon-badge">🚀</div>
            <h2>发现新版本</h2>
            <div class="version-tag">v2.0.3</div>
            <p class="desc">修复已知问题，体验更流畅</p>
            <div class="actions">
                <button class="btn btn-outline" id="ignoreBtn">忽略</button>
                <button class="btn" id="updateBtn">立即更新</button>
            </div>
        </div>
    </div>

    <!-- 欢迎回来容器 -->
    <div class="welcome-wrapper" id="ui-container">
        <div class="loading-text">
            <div class="text-item">欢迎回来</div>
        </div>
    </div>

    <script>
        // ---------- 状态栏适配 ----------
        function updateStatusBarStyle() {
            if (window.plus) {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (isDark) {
                    plus.navigator.setStatusBarBackground('#000000');
                    plus.navigator.setStatusBarStyle('light');
                } else {
                    plus.navigator.setStatusBarBackground('#F2F2F7');
                    plus.navigator.setStatusBarStyle('dark');
                }
            }
        }

        // ---------- 跳转到 home.html (或 qujiaweb.top) ----------
        function redirectToTarget() {
            var targetUrl = 'https://qujia.qujiaweb.top';
            // 如果点击“立即更新”，跳转到 qujiaweb.top (其他不变)
            // 但根据需求：点击更新跳转到 qujiaweb.top，其他不变 (这里用外部链接)
            // 我们通过全局标记控制，在点击更新时替换 target
            if (window._updateAction === 'update') {
                // 跳转到 qujiaweb.top (外部)
                window.location.replace('https://qujia.qujiaweb.top');
                return;
            }
            // 默认 (忽略) 跳转 home.html
            if (window.plus) {
                var targetWebview = plus.webview.create(targetUrl, targetUrl, {
                    backbuttonMaximize: false,
                    scrollIndicator: 'none'
                });
                targetWebview.show('fade-in', 250);
                setTimeout(function() {
                    plus.webview.currentWebview().close('none');
                }, 500);
            } else {
                window.location.replace(targetUrl);
            }
        }

        // ---------- 显示欢迎回来 + 跳转 ----------
        function showWelcomeAndRedirect() {
            var container = document.getElementById('ui-container');
            if (container) {
                container.style.display = 'flex';
            }
            setTimeout(function() {
                redirectToTarget();
            }, 500);
        }

        // ---------- 处理对话框 ----------
        function handleUpdateDialog() {
            const dialog = document.getElementById('updateDialog');
            const ignoreBtn = document.getElementById('ignoreBtn');
            const updateBtn = document.getElementById('updateBtn');

            // 点击忽略：关闭对话框，显示欢迎回来，然后跳转 (home.html)
            ignoreBtn.addEventListener('click', function() {
                window._updateAction = 'ignore';  // 标记忽略
                if (dialog) dialog.style.display = 'none';
                // 显示欢迎回来 & 跳转
                showWelcomeAndRedirect();
            });

            // 点击更新：跳转到 qujiaweb.top (且不显示欢迎回来，直接跳转)
            updateBtn.addEventListener('click', function() {
                window._updateAction = 'update';
                // 直接跳转 qujiaweb.top，不显示欢迎
                window.location.replace('https://qujiaweb.top/app/app.html?icon=https%3A%2F%2Fcdn-community.bcmcdn.com%2F47%2Fcommunity%2FgUODz5u55sQjk4IAI8O4zJDdQsduSf0yjUGHX58Ta7yo.jpeg%3Fhash%3DFl93yXRBidgKIWYbooTWROtcqGXs&name=趣加应用&link=https%3A%2F%2Fwwbbm.lanzouv.com%2Fit3ky490n28h&pwd=388b&简介=【应用介绍】%0A致力于优质资源分享&图片一=https%3A%2F%2Fcdn-community.bcmcdn.com%2F47%2Fcommunity%2FWLbGzw1dmFuONnPkFd6SXkH9Kjic4MW91gJrl3758yGW.jpeg%3Fhash%3DFsT6bca6GgbIizqHfdlt0yu8hsyG');
            });
        }

        // ---------- 页面初始化 ----------
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateStatusBarStyle);

        window.addEventListener('pageshow', function() {
            updateStatusBarStyle();
            // 页面显示时，对话框已经存在，不需要额外操作
        });

        document.addEventListener('plusready', function() {
            updateStatusBarStyle();
            plus.navigator.setFullscreen(false);
            plus.key.addEventListener('backbutton', function() {
                plus.runtime.quit();
            });
        });

        // DOM 就绪后绑定对话框事件
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            handleUpdateDialog();
        } else {
            document.addEventListener('DOMContentLoaded', handleUpdateDialog);
        }

        // 兜底：如果脚本加载完成时，直接绑定
        if (document.readyState === 'complete') {
            updateStatusBarStyle();
            // 注意：不自动执行 showWelcomeAndRedirect，等待用户点击忽略
        }
    </script>
</body>
</html>
