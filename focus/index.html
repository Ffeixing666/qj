<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
      
<title>趣加专注</title>
<!-- 图标：iOS 会用它作为主屏幕图标 -->
<link rel="apple-touch-icon" sizes="180x180"
      href="https://cdn-community.bcmcdn.com/47/community/kLSeoWDDl54Xz6eUxD1CEvIEiv1hyGUxwHK8IlitgMqw.jpeg?hash=Fl2nHPUSk8H5si6fPwGbdWwCiHYg">

<!-- 旧版 iOS 用这个可以去掉系统自动加的圆角高光效果（可选） -->
<link rel="apple-touch-icon-precomposed"
      href="https://cdn-community.bcmcdn.com/47/community/kLSeoWDDl54Xz6eUxD1CEvIEiv1hyGUxwHK8IlitgMqw.jpeg?hash=Fl2nHPUSk8H5si6fPwGbdWwCiHYg">

<!-- 主屏幕显示的名称 -->
<meta name="apple-mobile-web-app-title" content="趣加专注">

<!-- 下面两个是「全屏/类 App 体验」，想要才加 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f6fa;
  --card:rgba(255,255,255,.82);
  --card-solid:#fff;
  --text:#17181c;
  --sub:#747783;
  --line:rgba(20,24,35,.08);
  --accent:#ff5f57;
  --accent2:#ff8b73;
  --green:#32b37b;
  --shadow:0 18px 50px rgba(30,35,50,.09);
  --radius:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer}
.app{
  width:min(1180px,100%);
  margin:auto;
  min-height:100vh;
  padding:clamp(18px,3vw,34px);
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:11px}
.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px rgba(255,95,87,.10)}
.brand strong{font-size:18px;letter-spacing:-.02em}
.brand span{color:var(--sub);font-size:13px}
.music-btn{
  width:42px;height:42px;border-radius:14px;background:var(--card-solid);
  box-shadow:0 8px 24px rgba(30,35,50,.07);color:#50535d;
  display:grid;place-items:center;transition:.2s;
}
.music-btn:active{transform:scale(.94)}
.music-btn.on{color:var(--accent);background:#fff3f1}
.main-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);grid-template-rows:500px;gap:20px;align-items:stretch;min-height:0}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);border-radius:var(--radius);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.clock-card{height:500px;min-height:500px;padding:clamp(25px,4vw,48px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.clock-card:before,.clock-card:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.clock-card:before{width:260px;height:260px;right:-120px;top:-110px;background:rgba(255,95,87,.08)}
.clock-card:after{width:220px;height:220px;left:-150px;bottom:-130px;background:rgba(86,140,255,.06)}
.eyebrow{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.08em;margin-bottom:17px}
.time-wrap{display:flex;align-items:center;justify-content:center;gap:clamp(5px,1vw,12px);white-space:nowrap;margin:2px 0 18px}
.digit-box{
  width:clamp(55px,10vw,92px);
  height:clamp(82px,14vw,126px);
  overflow:hidden;border-radius:clamp(15px,2.2vw,24px);
  background:linear-gradient(180deg,#ffffff,#f0f1f5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 30px rgba(25,28,40,.08);
  position:relative;
  flex:0 0 auto;
}
.digit-strip{position:absolute;left:0;top:0;width:100%;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.digit{height:clamp(82px,14vw,126px);display:flex;align-items:center;justify-content:center;font-size:clamp(48px,8vw,76px);font-weight:720;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.colon{font-size:clamp(42px,7vw,70px);font-weight:700;color:#b5b7be;line-height:1;transform:translateY(-3px)}
.date{text-align:center;color:var(--sub);font-size:14px;min-height:21px}
.focus-note{margin:34px auto 0;display:flex;align-items:center;justify-content:center;gap:8px;color:#5c5f68;font-size:13px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(255,95,87,.10)}
.lookup-card{padding:clamp(22px,3vw,34px);height:500px;min-height:500px;max-height:500px;display:flex;flex-direction:column;overflow:hidden}
.card-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-title h2{font-size:22px;letter-spacing:-.03em;margin:0}
.card-title p{font-size:12px;color:var(--sub);margin:5px 0 0}
.search{
  height:54px;border-radius:17px;background:#f1f2f6;border:1px solid transparent;
  display:flex;align-items:center;padding:0 8px 0 16px;transition:.2s;
}
.search:focus-within{background:#fff;border-color:rgba(255,95,87,.28);box-shadow:0 8px 25px rgba(30,35,50,.06)}
.search svg{color:#8b8e98;flex:0 0 auto}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}
.search input::placeholder{color:#a4a6ad}
.search button{height:40px;padding:0 16px;border-radius:13px;background:var(--text);color:#fff;font-size:14px;font-weight:600;transition:.2s}
.search button:active{transform:scale(.96)}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 18px}
.quick button{background:#fff;border:1px solid var(--line);color:#666a74;padding:7px 11px;border-radius:10px;font-size:12px}
.result{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;padding-right:3px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.empty{height:100%;min-height:230px;display:grid;place-items:center;text-align:center;color:var(--sub);padding:30px}
.empty-icon{width:54px;height:54px;border-radius:18px;background:#fff;display:grid;place-items:center;margin:0 auto 12px;color:#b0b2ba;box-shadow:0 8px 22px rgba(30,35,50,.05)}
.loading{height:100%;min-height:230px;display:grid;place-items:center;color:var(--sub);font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #e5e6eb;border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;margin:auto auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.word-head{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:8px 0 14px}
.word{font-size:35px;font-weight:750;letter-spacing:-.045em;overflow-wrap:anywhere}
.phonetic{color:#777a84;font-size:14px;margin-top:5px}
.speak{
  width:46px;height:46px;border-radius:15px;background:#fff1ef;color:var(--accent);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:0 7px 20px rgba(255,95,87,.10);
}
.speak:active{transform:scale(.94)}
.audio-source{font-size:11px;color:#9a9ca4;margin:0 0 14px}
.meaning{padding:15px 0;border-top:1px solid var(--line)}
.pos{display:inline-flex;padding:5px 8px;border-radius:8px;background:#f0f1f5;color:#686b75;font-size:11px;font-weight:650;margin-bottom:8px}
.definition{font-size:15px;line-height:1.6;margin:0 0 5px}
.example{font-size:13px;line-height:1.55;color:#7c7f88;margin:0;padding-left:13px;border-left:2px solid #e6e7eb}
.example em{color:#61646d}
.more{font-size:12px;color:#9b9da5;margin-top:7px}
.error{margin-top:18px;background:#fff6f5;border:1px solid #ffe0dc;color:#a5574f;padding:13px 14px;border-radius:14px;font-size:13px;line-height:1.55}
.source{font-size:11px;color:#a0a2aa;margin-top:15px}
.footer{padding:17px 4px 3px;color:#a0a2aa;text-align:center;font-size:11px}
@media(max-width:860px){
  .main-grid{grid-template-columns:1fr;grid-template-rows:500px 500px}
  .clock-card{height:500px;min-height:500px}
  .lookup-card{height:500px;min-height:500px;max-height:500px;padding:22px}
}
@media(max-width:520px){
  .app{padding:14px}
  .topbar{margin-bottom:14px}
  .brand strong{font-size:17px}
  .brand span{display:none}
  .clock-card{border-radius:24px}
  .lookup-card{border-radius:24px}
  .time-wrap{gap:4px}
  .digit-box{width:calc((100vw - 82px)/4);height:82px;border-radius:15px}
  .digit{height:82px;font-size:47px}
  .colon{font-size:38px}
  .word{font-size:31px}
  .search button{padding:0 13px}
}
@media(prefers-reduced-motion:reduce){
  .digit-strip,.search button,.music-btn,.speak{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <strong>专注 Focus</strong>
      <span>让注意力回到当下</span>
    </div>
    <button class="music-btn" id="musicBtn" aria-label="开启背景音乐" title="背景音乐">
      <svg id="musicIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l10-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="16" cy="16" r="3"></circle>
      </svg>
    </button>
  </header>

  <main class="main-grid">
    <section class="card clock-card">
      <div class="eyebrow">FOCUS TIME</div>
      <div class="time-wrap" aria-label="当前时间">
        <div class="digit-box"><div class="digit-strip" id="h1"></div></div>
        <div class="digit-box"><div class="digit-strip" id="h2"></div></div>
        <div class="colon">:</div>
        <div class="digit-box"><div class="digit-strip" id="m1"></div></div>
        <div class="digit-box"><div class="digit-strip" id="m2"></div></div>
      </div>
      <div class="date" id="dateText"></div>
      <div class="focus-note"><span class="pulse"></span><span>现在，专心做一件事</span></div>
    </section>

    <section class="card lookup-card">
      <div class="card-title">
        <div>
          <h2>英文单词</h2>
          <p>释义 · 用法 · 读音 · 例句</p>
        </div>
      </div>

      <form class="search" id="searchForm">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
        </svg>
        <input id="wordInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词，例如 abandon">
        <button type="submit">查询</button>
      </form>

      <div class="quick" id="quickWords">
        <button type="button" data-word="focus">focus</button>
        <button type="button" data-word="improve">improve</button>
        <button type="button" data-word="achieve">achieve</button>
        <button type="button" data-word="concentrate">concentrate</button>
      </div>

      <div class="result" id="result">
        <div class="empty">
          <div>
            <div class="empty-icon">
              <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path>
                <path d="M4 5.5v15"></path><path d="M8 7h8M8 10h7"></path>
              </svg>
            </div>
            <div>输入一个单词开始学习</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="footer"></div>
</div>

<audio id="bgm" loop preload="auto" src="https://creation.bcmcdn.com/716/appcraft/SOUND_QWPiRIxyx_1790780770209.mp3"></audio>

<script>
const $=id=>document.getElementById(id);

function makeDigit(id){
  const el=$(id);
  el.innerHTML=Array.from({length:10},(_,i)=>`<div class="digit">${i}</div>`).join("");
}
["h1","h2","m1","m2"].forEach(makeDigit);

let lastTime="";
function updateClock(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  const key=hh+mm;
  if(key!==lastTime){
    [["h1",hh[0]],["h2",hh[1]],["m1",mm[0]],["m2",mm[1]]].forEach(([id,n])=>{
      $(id).style.transform=`translateY(calc(-1 * ${Number(n)} * var(--digit-h)))`;
    });
    lastTime=key;
  }
  const months=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
  const weeks=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  $("dateText").textContent=`${d.getFullYear()}年 ${months[d.getMonth()]} ${d.getDate()}日 · ${weeks[d.getDay()]}`;
}
document.documentElement.style.setProperty("--digit-h",getComputedStyle(document.querySelector(".digit")).height);
updateClock();
setInterval(updateClock,1000);
window.addEventListener("resize",()=>document.documentElement.style.setProperty("--digit-h",getComputedStyle(document.querySelector(".digit")).height));

function showToast(message){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);padding:11px 15px;border-radius:13px;background:rgba(25,26,30,.92);color:#fff;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis";
    document.body.appendChild(t);
  }
  t.textContent=message;
  t.style.opacity="1";
  t.style.transform="translate(-50%,0)";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>{t.style.opacity="0";t.style.transform="translate(-50%,10px)"},2200);
}
const bgm=$("bgm"),musicBtn=$("musicBtn");
let musicOn=false;
musicBtn.addEventListener("click",async()=>{
  try{
    if(musicOn){bgm.pause();musicOn=false;}
    else{await bgm.play();musicOn=true;}
    musicBtn.classList.toggle("on",musicOn);
    musicBtn.setAttribute("aria-label",musicOn?"关闭背景音乐":"开启背景音乐");
  }catch(e){
    musicOn=false;
    musicBtn.classList.remove("on");
    showToast("音乐暂时无法播放，请检查网络或设备静音状态");
  }
});

const result=$("result"),input=$("wordInput"),form=$("searchForm");
const cacheKey="focus_dictionary_cache_v2";
const memory={};
try{Object.assign(memory,JSON.parse(localStorage.getItem(cacheKey)||"{}"));}catch(e){}

function escapeHTML(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function cleanWord(v){
  return v.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ");
}
function firstAudio(data){
  for(const entry of data||[]){
    for(const p of entry.phonetics||[]){
      if(p&&p.audio){
        const a=p.audio.startsWith("//")?"https:" : p.audio;
        return a;
      }
    }
  }
  return "";
}
function firstPhonetic(data){
  for(const entry of data||[]){
    if(entry.phonetic)return entry.phonetic;
    for(const p of entry.phonetics||[])if(p.text)return p.text;
  }
  return "";
}
function saveWord(word,out){
  memory[word]=out;
  try{localStorage.setItem(cacheKey,JSON.stringify(memory));}catch(e){}
  return out;
}
function normalizeKeyKey(payload,word){
  if(!payload||payload.success!==true||!payload.data)throw new Error(payload?.error||"keykey failed");
  const d=payload.data;
  const entries=[];
  const trans=Array.isArray(d.trans)?d.trans:[];
  const practice=Array.isArray(d.practiceTrans)?d.practiceTrans:[];
  const all=[...new Set([...trans,...practice])];
  const english=d.englishDefinition||"";
  if(all.length){
    all.forEach(item=>{
      const raw=String(item).trim();
      const m=raw.match(/^([^\.。；;]+?)[\.。；;]\s*(.*)$/);
      entries.push({pos:m?m[1].trim():"释义",definition:m?m[2].trim():raw,example:""});
    });
  }
  if(english)entries.push({pos:"English",definition:english,example:""});
  for(const ex of (d.examples||[]).slice(0,4)){
    const target=ex.sentence||"";
    if(target){
      let entry=entries.find(x=>!x.example);
      if(!entry)entries.push({pos:"例句",definition:"",example:target});
      else entry.example=target;
    }
  }
  if(!entries.length)throw new Error("empty dictionary result");
  return {
    word:d.displayWord||d.word||word,
    phonetic:d.phonetic||"",
    audio:"",
    entries,
    source:"KeyKey 公共词典 API",
    translations:all,
    examples:d.examples||[]
  };
}
function normalizeFree(data){
  if(!Array.isArray(data)||!data.length)throw new Error("empty");
  const entries=[];
  for(const entry of data){
    for(const meaning of entry.meanings||[]){
      for(const def of (meaning.definitions||[]).slice(0,4)){
        entries.push({pos:meaning.partOfSpeech||"word",definition:def.definition||"",example:def.example||""});
      }
    }
  }
  if(!entries.length)throw new Error("no definitions");
  return {word:data[0].word||"",phonetic:firstPhonetic(data),audio:firstAudio(data),entries,source:"Free Dictionary API"};
}
function normalizeWiki(data,word){
  const en=data?.en;
  if(!en)throw new Error("no en");
  const entries=[];
  for(const [pos,groups] of Object.entries(en)){
    if(!Array.isArray(groups))continue;
    for(const group of groups){
      for(const d of (group.definitions||[]).slice(0,4)){
        entries.push({pos:pos==="noun"?"名词":pos==="verb"?"动词":pos==="adjective"?"形容词":pos==="adverb"?"副词":pos,definition:typeof d==="string"?d:(d.definition||""),example:d.example||""});
      }
    }
  }
  if(!entries.length)throw new Error("no definitions");
  return {word,phonetic:"",audio:"",entries,source:"Wiktionary"};
}
async function fetchJSON(url,timeout=6500){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{signal:controller.signal,cache:"no-store",headers:{"Accept":"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();
  }finally{clearTimeout(timer);}
}
async function lookup(word){
  if(memory[word])return memory[word];

  // 主线路：KeyKey 公共词典。免 Key，并开启本地词典兜底。
  const keykey="https://api.keykey.im/api/public/memory-card?word="+encodeURIComponent(word)+"&lang=en&includeLocalDictionaryFallback=true";
  try{
    const data=await fetchJSON(keykey,7000);
    return saveWord(word,normalizeKeyKey(data,word));
  }catch(e){}

  // 第二线路：Wiktionary 公共 API。
  const wiki="https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(word);
  try{
    const data=await fetchJSON(wiki,6500);
    return saveWord(word,normalizeWiki(data,word));
  }catch(e){}

  // 最后线路：原免费词典，仅作为兼容性备用，不影响主线路。
  const primary="https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word);
  const data=await fetchJSON(primary,5500);
  return saveWord(word,normalizeFree(data));
}

function speak(word){
  if(!("speechSynthesis" in window))return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang="en-US";
    u.rate=.86;
    u.pitch=1;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false}
}
function renderWord(data){
  const audio=data.audio;
  const entries=data.entries.slice(0,8);
  result.innerHTML=`
    <div class="word-head">
      <div>
        <div class="word">${escapeHTML(data.word)}</div>
        ${data.phonetic?`<div class="phonetic">${escapeHTML(data.phonetic)}</div>`:""}
      </div>
      <button class="speak" id="speakBtn" aria-label="播放发音" title="播放发音">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 3 9 3 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18 6a9 9 0 0 1 0 12"></path>
        </svg>
      </button>
    </div>
    <div class="audio-source">${audio?"词典音频已就绪 · 点击右侧按钮播放":"使用设备内置英语语音 · 无需额外下载音频"}</div>
    ${entries.map(x=>`
      <div class="meaning">
        <div class="pos">${escapeHTML(x.pos)}</div>
        <p class="definition">${escapeHTML(x.definition)}</p>
        ${x.example?`<p class="example">“${escapeHTML(x.example)}”</p>`:""}
      </div>
    `).join("")}
    ${data.entries.length>8?`<div class="more">已展示前 8 条释义</div>`:""}
    <div class="source">${escapeHTML(data.source)}</div>
  `;
  $("speakBtn").addEventListener("click",()=>{
    if(audio){
      const a=new Audio(audio);
      a.play().catch(()=>speak(data.word));
    }else{
      const ok=speak(data.word);
      if(!ok)showToast("当前设备不支持英语语音播放");
    }
  });
}
async function searchWord(word){
  word=cleanWord(word);
  if(!/^[a-z][a-z '-]{0,48}$/i.test(word)){
    result.innerHTML=`<div class="error">请输入一个英文单词。暂不支持整句搜索。</div>`;
    return;
  }
  result.innerHTML=`<div class="loading"><div><div class="spinner"></div>正在查词…</div></div>`;
  try{
    const data=await lookup(word);
    renderWord(data);
  }catch(e){
    result.innerHTML=`<div class="error"><strong>暂时没有查到 “${escapeHTML(word)}”</strong><br>可能是网络响应较慢、单词不存在，或当前网络无法访问词典服务。请稍后再试；常用词查询结果会自动缓存在本地。</div>`;
  }
}
form.addEventListener("submit",e=>{e.preventDefault();searchWord(input.value)});
document.querySelectorAll("#quickWords button").forEach(b=>b.addEventListener("click",()=>{
  input.value=b.dataset.word;
  searchWord(b.dataset.word);
}));

// 首次载入时不主动联网查词，避免打开页面就产生请求。
</script>
</body>
</html>
